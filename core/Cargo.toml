[package]
name = "ram-core"
version = "1.0.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cpal = "0.18.2"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.35"
once_cell = "1.21.4"
parking_lot = "0.13.0"
pdfium-render = "0.9.6"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
whisper-rs = "0.16.0"
whisper-rs-sys = "0.15"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
