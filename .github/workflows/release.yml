# Builds the installers for macOS (universal .dmg), Windows (.msi + setup .exe) and Linux (.AppImage, .deb, .rpm).
# Push a tag like v1.0.0 to make a draft release; run it by hand to just get the files as artifacts.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# creating the draft release and uploading the installers to it
permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fetch-vendor.sh
      - run: cargo test -p ram-core --release
        env:
          RAM_PDFIUM_DIR: ${{ github.workspace }}/vendor/pdfium/mac-arm64/lib

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            vendor: mac
            args: --target universal-apple-darwin --config tauri.release.conf.json
          - os: windows-latest
            vendor: win-x64
            args: ""
          - os: ubuntu-22.04
            vendor: linux-x64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libclang-dev cmake
      - name: Speech model and pdfium
        shell: bash
        run: scripts/fetch-vendor.sh ${{ matrix.vendor }}
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: signed with a Developer ID and notarized by Apple, so it opens without a warning.
          # Local builds (scripts/build-app.sh) stay ad hoc signed, see tauri.macos.conf.json.
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: app
          tauriScript: ../ui/node_modules/.bin/tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Repeat After Me ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.vendor }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
